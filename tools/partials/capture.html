<section id="kl-capture" class="kl-capture" aria-labelledby="kl-capture-title" data-kl-track-manual="true" data-capture-category="{{category}}" data-capture-unit="{{unit}}">
  <div class="kl-capture-heading"><div><p class="kl-capture-eyebrow">Sua próxima escolha</p>
    <h2 id="kl-capture-title">Receba modelos no seu WhatsApp.</h2>
    <p>Continue sua escolha com a Koisa Linda.</p></div>
    <button id="kl-capture-open" type="button" aria-controls="kl-capture-form" aria-expanded="false">Receber modelos no WhatsApp</button>
    <button id="kl-capture-close" type="button" aria-label="Fechar convite" hidden>×</button>
  </div>
  <form id="kl-capture-form" hidden>
    <label class="kl-capture-phone" for="kl-capture-phone">WhatsApp com DDD
      <input id="kl-capture-phone" name="telefone" type="tel" inputmode="tel" autocomplete="tel" maxlength="22" placeholder="DDD + celular" required aria-describedby="kl-capture-use">
    </label>
    <div class="kl-capture-trap" aria-hidden="true"><label for="kl-capture-website">Site<input id="kl-capture-website" name="website" type="text" tabindex="-1" autocomplete="off"></label></div>
    <p id="kl-capture-use">Usaremos seu número para entregar os modelos que você pedir. Na próxima etapa, envie a mensagem preparada no seu WhatsApp para confirmar.</p>
    <label class="kl-capture-consent"><input id="kl-capture-marketing" name="marketing" type="checkbox"><span>Também quero receber novidades e dicas da Koisa Linda pelo WhatsApp. Posso cancelar quando quiser.</span></label>
    <label class="kl-capture-consent"><input id="kl-capture-measurement" name="measurement" type="checkbox"><span>Permito relacionar esta visita ao meu atendimento e às compras para medir os resultados dos anúncios no Google. Opcional; posso retirar essa autorização.</span></label>
    <button id="kl-capture-submit" type="submit">Receber modelos no WhatsApp</button>
    <a class="kl-capture-privacy" href="/privacidade/">Como cuidamos dos seus dados</a>
  </form>
  <div id="kl-capture-result" hidden><p id="kl-capture-status" role="status" aria-live="polite"></p><button id="kl-capture-continue" data-kl-track-manual="true" type="button" hidden>Abrir WhatsApp e enviar meu pedido</button></div>
</section>
