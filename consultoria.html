<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seu momento continua por aqui | Koisa Linda</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://koisalinda.com.br/">
<meta http-equiv="refresh" content="0; url=/">
<link rel="icon" href="/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="stylesheet" href="/kl-fonts.css">
<style>
:root{--ruby:#722F37;--ruby-dark:#5a242b;--cream:#FBF7EF;--ink:#2c2326;--muted:#6f625a;--line:#e9e0d2}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px;background:var(--cream);color:var(--ink);font-family:'Arapey',Georgia,serif;text-align:center}
main{max-width:40rem}
.logo{display:inline-block;margin-bottom:28px}
.logo img{display:block;width:96px;height:auto}
.eyebrow{margin:0 auto 18px;font-family:'Questrial',Arial,sans-serif;font-size:11.5px;letter-spacing:5px;text-transform:uppercase;color:var(--muted)}
h1{margin:0 0 16px;text-wrap:balance;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(32px,7vw,46px);line-height:1.12;color:var(--ruby)}
p{margin:0 auto 32px;max-width:28rem;font-size:20px;line-height:1.6}
.btn{display:inline-block;padding:14px 30px;border-radius:30px;background:var(--ruby);color:var(--cream);font-family:'Questrial',Arial,sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:background .2s,letter-spacing .2s}
.btn:hover{background:var(--ruby-dark);letter-spacing:2.6px}
.btn:focus-visible{outline:2px solid var(--ruby);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
  <a class="logo" href="/"><img src="/img/logo-kl-main.png" alt="Koisa Linda" width="96" height="96" decoding="async"></a>
  <p class="eyebrow">Koisa Linda · desde 1994</p>
  <h1>Seu momento continua por aqui.</h1>
  <p>Esta página saiu do ar. Na página inicial você encontra noivas, debutantes, festa, o catálogo e as nossas lojas.</p>
  <a class="btn" id="kl-redirect" href="/">Ir para a página inicial</a>
</main>
<script src="/kl-redirect.js"></script>
</body>
</html>
